apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydrator-guestbook
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: hydrator-guestbook
  template:
    metadata:
      labels:
        app: hydrator-guestbook
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: guestbook
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
